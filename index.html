    let state = loadState();
    let activeCategoryId = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.catalog)) {
            return {
              version: parsed.version || 4,
              exportedAt: parsed.exportedAt || DEFAULT_BACKUP.exportedAt,
              catalog: parsed.catalog,
              progress: parsed.progress || {}
            };
          }
        }
      } catch (e) {
        console.warn("로컬 저장소 로드 실패, 기본 백업 사용:", e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_BACKUP));
    }

    function saveState() {
      state.exportedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("로컬 저장소 저장 한도 초과 가능:", e);
      }
      render();
    }

    function isItemDone(catId, item) {
      const val = (state.progress[catId] && state.progress[catId][item.id]) || 0;
      const max = item.maxSteps || 1;
      return val >= max;
    }

    function toggleItem(catId, item) {
      if (!state.progress[catId]) state.progress[catId] = {};
      const max = item.maxSteps || 1;
      const cur = state.progress[catId][item.id] || 0;
      state.progress[catId][item.id] = cur >= max ? 0 : max;
      saveState();
    }

    function getCategoryCounts(cat) {
      const items = cat.items || [];
      let done = 0;
      for (const it of items) {
        if (isItemDone(cat.id, it)) done++;
      }
      return { done, total: items.length };
    }

    function render() {
      let totalDone = 0;
      let totalItems = 0;
      for (const cat of state.catalog) {
        const c = getCategoryCounts(cat);
        totalDone += c.done;
        totalItems += c.total;
      }
      const pct = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;
      document.getElementById("overallStats").textContent = `전체 진행도: ${totalDone} / ${totalItems} (${pct}%)`;

      if (!activeCategoryId) {
        document.getElementById("viewHub").style.display = "block";
        document.getElementById("viewDetail").style.display = "none";
        renderHub();
      } else {
        document.getElementById("viewHub").style.display = "none";
        document.getElementById("viewDetail").style.display = "block";
        renderDetail(activeCategoryId);
      }
    }

    function renderHub() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";
      for (const cat of state.catalog) {
        const { done, total } = getCategoryCounts(cat);
        const pct = total ? Math.round((done / total) * 100) : 0;
        const card = document.createElement("div");
        card.className = "cat-card";
        card.innerHTML = `
          <div class="cat-top">
            <span class="cat-title">${cat.icon || "📌"} ${escapeHtml(cat.name)}</span>
            <span class="tag">${done} / ${total} (${pct}%)</span>
          </div>
          <div class="cat-desc">${escapeHtml(cat.description || "")}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        `;
        card.addEventListener("click", () => {
          activeCategoryId = cat.id;
          render();
        });
        grid.appendChild(card);
      }
    }

    function renderDetail(catId) {
      const cat = state.catalog.find(c => c.id === catId);
      if (!cat) {
        activeCategoryId = null;
        render();
        return;
      }
      document.getElementById("detailTitle").textContent = `${cat.icon || ""} ${cat.name}`;
      document.getElementById("detailDesc").textContent = cat.description || "";

      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const statusFilter = document.getElementById("filterStatus").value;

      const groupOrder = [];
      const grouped = {};
      for (const item of (cat.items || [])) {
        const done = isItemDone(cat.id, item);
        if (statusFilter === "done" && !done) continue;
        if (statusFilter === "todo" && done) continue;
        const hay = `${item.group || ""} ${item.title || ""} ${item.tag || ""} ${item.hint || ""}`.toLowerCase();
        if (q && !hay.includes(q)) continue;

        const g = item.group || "기타";
        if (!grouped[g]) {
          grouped[g] = [];
          groupOrder.push(g);
        }
        grouped[g].push(item);
      }

      const container = document.getElementById("groupsContainer");
      container.innerHTML = "";

      for (const g of groupOrder) {
        const list = grouped[g];
        const gDone = list.filter(it => isItemDone(cat.id, it)).length;
        const gMeta = (cat.groupImages && cat.groupImages[g]) || { caption: g, image: "" };

        const sec = document.createElement("div");
        sec.className = "group-section";

        const header = document.createElement("div");
        header.className = "group-header";
        header.innerHTML = `
          <div class="group-title-wrap">
            <span class="group-name">${escapeHtml(g)} <span class="tag">${gDone} / ${list.length}</span></span>
            <span class="group-caption">${escapeHtml(gMeta.caption || "")}</span>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <label class="btn edit-only" style="cursor:pointer;">

          </div>
        `;
        sec.appendChild(header);

        const imgInput = header.querySelector(`input[data-group-img]`);
        if (imgInput) {
          imgInput.addEventListener("change", (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              if (!cat.groupImages) cat.groupImages = {};
              cat.groupImages[g] = { ...(cat.groupImages[g] || {}), image: reader.result };
              saveState();
            };
            reader.readAsDataURL(file);
          });

        const capBtn = header.querySelector(`button[data-edit-caption]`);

          capBtn.addEventListener("click", () => {

          const imgBox = document.createElement("div");
          imgBox.className = "group-img-box";
          const imgEl = document.createElement("img");
          imgEl.src = gMeta.image;
          imgEl.alt = g;
          imgEl.addEventListener("click", () => openModal(gMeta.image, gMeta.caption || g));
          imgBox.appendChild(imgEl);
          sec.appendChild(imgBox);
        }

        const grid = document.createElement("div");
        grid.className = "items-list";

        for (const item of list) {
          const done = isItemDone(cat.id, item);
          const card = document.createElement("div");
          card.className = `item-card ${done ? "done" : ""}`;

          let synthHtml = "";
          if (cat.id === "accessories") {
            const presets = Array.isArray(item.synthPresets) ? item.synthPresets : [];
            const rows = presets.map((p, idx) => `
              <div class="synth-row">
                <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                  <input type="checkbox" ${p.done ? "checked" : ""} data-synth-idx="${idx}" />
                  <span><strong>[${escapeHtml(p.role || "추천")}]</strong> ${escapeHtml(p.option || "")}</span>
                </label>
              </div>
            `).join("");
            synthHtml = `
              <div class="synth-list">
                ${rows || '<span class="hint">등록된 추천 합성이 없습니다.</span>'}
                <button type="button" class="edit-only" data-add-synth="${escapeAttr(item.id)}">+ 추천 합성 추가</button>
              </div>
            `;
          }

          const rewardText = (item.stepRewards && item.stepRewards[0]) || item.completeReward || "";
          card.innerHTML = `
            <div class="item-head">
              <label class="item-check">
                <input type="checkbox" ${done ? "checked" : ""} />
                <span>${escapeHtml(item.title)}</span>
              </label>
              ${item.tag ? `<span class="tag">${escapeHtml(item.tag)}</span>` : ""}
            </div>
            ${item.hint ? `<div class="hint">${escapeHtml(item.hint)}</div>` : ""}
            ${rewardText ? `<div class="reward">🎁 ${escapeHtml(rewardText)}</div>` : ""}
            ${synthHtml}
          `;

          const cb = card.querySelector('.item-check input[type="checkbox"]');
          cb.addEventListener("change", () => toggleItem(cat.id, item));

          card.querySelectorAll('input[data-synth-idx]').forEach(scb => {
            scb.addEventListener("change", () => {
              const idx = Number(scb.getAttribute("data-synth-idx"));
              if (item.synthPresets && item.synthPresets[idx]) {
                item.synthPresets[idx].done = scb.checked;
                saveState();
              }
            });
          });

          const addSynthBtn = card.querySelector(`button[data-add-synth]`);
          if (addSynthBtn) {
            addSynthBtn.addEventListener("click", () => {
              const role = prompt("용도/역할을 입력하세요 (예: 물리화력, 수비, 이론치):", "추천 합성");
              if (role === null) return;
              const option = prompt("추천 합성 옵션 및 이론치를 입력하세요:", "");
              if (option === null || !option.trim()) return;
              if (!Array.isArray(item.synthPresets)) item.synthPresets = [];
              item.synthPresets.push({ role: role.trim(), option: option.trim(), done: false });
              saveState();
            });
          }

          grid.appendChild(card);
        }

        sec.appendChild(grid);
        container.appendChild(sec);
      }
    }

    function openModal(src, caption) {
      document.getElementById("modalImg").src = src;
      document.getElementById("modalCaption").textContent = caption || "";
      document.getElementById("imgModal").classList.add("open");
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function escapeAttr(s) {
      return String(s ?? "").replace(/"/g, "&quot;");
    }

    document.getElementById("btnHome").addEventListener("click", () => {
      activeCategoryId = null;
      render();
    });
    document.getElementById("btnBackHub").addEventListener("click", () => {
      activeCategoryId = null;
      render();
    });
    document.getElementById("btnToggleEdit").addEventListener("click", () => {
      document.body.classList.toggle("edit-mode");
    });
    document.getElementById("searchInput").addEventListener("input", () => render());
    document.getElementById("filterStatus").addEventListener("change", () => render());
    document.getElementById("btnCloseModal").addEventListener("click", () => {
      document.getElementById("imgModal").classList.remove("open");
    });
    document.getElementById("imgModal").addEventListener("click", (e) => {
      if (e.target.id === "imgModal") e.target.classList.remove("open");
    });

    document.getElementById("btnExportJson").addEventListener("click", () => {
      const payload = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "dq10_tracker_backup_recovered.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("fileImportJson").addEventListener("change", (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && Array.isArray(parsed.catalog)) {
            state = {
              version: parsed.version || 4,
              exportedAt: parsed.exportedAt || new Date().toISOString(),
              catalog: parsed.catalog,
              progress: parsed.progress || {}
            };
            saveState();
            alert("백업 JSON을 불러왔습니다.");
          } else {
            alert("유효한 트래커 JSON 형식이 아닙니다.");
          }
        } catch (err) {
          alert("JSON 파싱 오류: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("btnAddItem").addEventListener("click", () => {
      const cat = state.catalog.find(c => c.id === activeCategoryId);
      if (!cat) return;
      const group = prompt("세부 지역/그룹명을 입력하세요:", "항구도시 렌도아 북부");
      if (group === null || !group.trim()) return;
      const title = prompt("항목(NPC/악세서리) 이름을 입력하세요:", "");
      if (title === null || !title.trim()) return;
      const tag = prompt("좌표/태그를 입력하세요 (선택):", "");
      const hint = prompt("힌트/설명을 입력하세요 (선택):", "");
      cat.items.push({
        id: "item_" + Date.now(),
        group: group.trim(),
        title: title.trim(),
        tag: (tag || "").trim(),
        hint: (hint || "").trim(),
        image: "",
        maxSteps: 1,
        stepRewards: cat.id === "yellow_diary" ? ["작은 메달 1장"] : [],
        completeReward: "",
        synthPresets: cat.id === "accessories" ? [] : undefined
      });
      if (!cat.groupImages) cat.groupImages = {};
      if (!cat.groupImages[group.trim()]) {
        cat.groupImages[group.trim()] = { caption: group.trim(), image: "" };
      }
      saveState();
    });

    render();
  </script>
</body>
</html>
