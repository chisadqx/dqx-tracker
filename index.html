<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드래곤 퀘스트 10 콘텐츠 진행도 트래커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .progress-transition {
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover {
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 공유 모드 알림 배너 (공유 URL 접속 시 표시) -->
    <div id="shared-banner" class="hidden bg-indigo-600 text-white px-4 py-3 shadow-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 text-sm font-medium">
                <span class="bg-white/20 px-2 py-0.5 rounded text-xs font-bold">공유 열람 모드</span>
                <span>다른 사람이 공유한 진행도를 보고 있습니다. (내 데이터는 안전하게 보호됩니다)</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="overwriteMyDataWithShared()" class="px-3 py-1.5 bg-white text-indigo-700 hover:bg-indigo-50 rounded-lg text-xs font-bold transition shadow-sm">
                    내 데이터에 덮어쓰기
                </button>
                <button onclick="exitSharedMode()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-900 text-white rounded-lg text-xs font-semibold transition">
                    내 데이터로 돌아가기
                </button>
            </div>
        </div>
    </div>

    <!-- 상단 공통 헤더 -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <button onclick="navigateToHub()" class="flex items-center gap-2.5 text-left group">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm group-hover:bg-indigo-700 transition">
                        ✓
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight leading-tight">
                            드래곤 퀘스트 10 콘텐츠 진행도 트래커
                        </h1>
                        <p class="text-xs text-slate-500 hidden sm:block">DQ10 수집·육성·과제 진행도를 체크하고 링크로 공유하세요</p>
                    </div>
                </button>
                <a href="https://chisadqx.github.io/dqx-navi/" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0">
                    <span>🧭 일과·주과 내비</span>
                </a>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openItemModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5">
                    <span>+ 항목 추가</span>
                </button>
                <button onclick="openManageModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition">
                    관리
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">

        <!-- 1. 메인 허브 뷰 (카테고리 선택 화면) -->
        <section id="hub-view" class="space-y-6">
            <!-- 전체 통합 진행률 카드 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                    <div>
                        <span class="inline-block px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold mb-1.5">
                            드래곤 퀘스트 10 전체 요약
                        </span>
                        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">
                            통합 진행도 <span id="hub-total-percent
